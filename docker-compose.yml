version: '3.8'

services:
  # Main API Gateway (NestJS)
  api-gateway:
    build: 
      context: ./apps/backend
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://fems:hustle@postgres:5432/femschat
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka

  # Messaging Microservice
  chat-service:
    build:
      context: ./apps/backend
      dockerfile: apps/chat-service/Dockerfile
    environment:
      - KAFKA_BROKERS=kafka:9092
      - MONGO_URL=mongodb://mongo:27017/chatlogs
    depends_on:
      - kafka
      - mongo

  # Fintech Wallet Microservice
  wallet-service:
    build:
      context: ./apps/backend
      dockerfile: apps/wallet-service/Dockerfile
    environment:
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - MONNIFY_API_KEY=${MONNIFY_API_KEY}
    depends_on:
      - postgres

  # Real-time Signalling & SFU (LiveKit)
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # Databases
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=fems
      - POSTGRES_PASSWORD=hustle
      - POSTGRES_DB=femschat
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:latest
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

volumes:
  pgdata: